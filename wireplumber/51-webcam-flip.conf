# Disable the original upside-down Toshiba camera nodes
# so they don't appear in app camera menus.
# The ffmpeg flip pipeline reads directly from /dev/video1
# (the raw V4L2 device) so PipeWire disabling does not affect it.

monitor.v4l2.rules = [
  {
    matches = [
      {
        # Match the original Toshiba camera nodes
        node.name = "v4l2_input.pci-0000_c4_00.4-usb-0_1_1.0"
      }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
  {
    matches = [
      {
        node.name = "v4l2_input.pci-0000_c4_00.4-usb-0_1_1.2"
      }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]