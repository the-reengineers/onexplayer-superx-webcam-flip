#
# Sourced by ~/.local/bin/webcam-flip (bash). Every value below
# defaults to what is written here; uncomment a line to change it.
# The file is installed to ~/.config/webcam-flip.conf and is NOT
# overwritten on reinstall — edit it freely.

# Source camera device. Empty = auto-detect (first Toshiba camera
# supporting WIDTHxHEIGHT, i.e. the Super X built-in webcam).
#SOURCE="/dev/video1"

# v4l2loopback device that apps see as "Camera".
#LOOPBACK="/dev/video10"

# Capture format. The keeper only supports YUYV, which is the
# built-in camera's native format at this resolution.
#WIDTH=1280
#HEIGHT=720
#PIXFMT="YUYV"

# Framerate of the idle black frames the keeper writes. 10 matches
# the camera's actual output rate, so apps negotiate consistently
# across the idle → live swap.
#KEEPER_FPS=10

# Seconds between consumer checks (fuser on the loopback device).
#POLL_INTERVAL=0.5

# Seconds after the last consumer leaves before the camera powers off.
#STOP_DELAY=2

# The Toshiba camera's uvcvideo driver returns EBUSY for a few seconds
# after a previous writer closed it; these control how long the script
# retries opening it before falling back to the keeper.
#CAMERA_OPEN_RETRIES=8
#CAMERA_OPEN_WAIT=2
#REAL_RETRY_COOLDOWN=10
